services: 
  mongodb:
    image: mongo:8.3.8

    container_name: mongodb
    
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}


    ports:
      - "27007:27017"
    
    
    volumes:
      - mongodb_data:/data/db

    
    networks:
      - backend
    
    restart: always

volumes:
  mongodb_data:
  
networks:
  backend:
